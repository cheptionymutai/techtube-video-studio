<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Payment page: keep out of search results and keep the URL (it carries the customer's email) away from other sites. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="same-origin">
    <title>Secure Checkout | Techtube Studio</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.paystack.co/v1/inline.js" onerror="window.__paystackFailed = true"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'brand-dark': '#031F14', 'brand-primary': '#18795B', 'brand-accent': '#8fcdb5', 'brand-light': '#e8e9e2' } } } }
    </script>
    <style>
        .checkout-card { box-shadow: 0 20px 60px -10px rgba(0, 0, 0, 0.45); }
    </style>
</head>
<body class="bg-brand-dark text-brand-dark font-sans antialiased min-h-screen flex flex-col">

    <main class="flex-1 flex items-center justify-center px-4 py-10 relative overflow-hidden">
        <div class="absolute inset-0 opacity-[0.07]" style="background-image: radial-gradient(circle at 20% 20%, #8fcdb5 1px, transparent 1px); background-size: 28px 28px;"></div>

        <div class="relative z-10 w-full max-w-md">
            <a href="/" class="block text-center mb-6">
                <img src="/techtube-logo.jpg" alt="Techtube Video Studio" class="h-10 mx-auto" onerror="this.style.display='none'">
            </a>

            <!-- PAYMENT CARD -->
            <div id="checkout-card" class="checkout-card bg-white rounded-[2rem] p-8 md:p-10 text-center">
                <h1 class="text-2xl font-black uppercase tracking-tight mb-2">Secure Checkout</h1>
                <p class="text-gray-500 text-sm mb-8" id="order-desc">Loading details...</p>

                <div class="bg-brand-light/40 rounded-2xl p-6 mb-8 border border-brand-primary/10">
                    <span class="block text-gray-400 uppercase text-[10px] font-black tracking-widest mb-1">Amount Due</span>
                    <span class="text-4xl font-black text-brand-primary" id="display-amount">...</span>
                </div>

                <div class="mb-8">
                    <p class="text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-3">Accepted Methods</p>
                    <div class="flex justify-center flex-wrap gap-2">
                        <span class="px-4 py-1.5 rounded-full bg-brand-light text-brand-dark text-xs font-bold">M-Pesa</span>
                        <span class="px-4 py-1.5 rounded-full bg-brand-light text-brand-dark text-xs font-bold">Visa</span>
                        <span class="px-4 py-1.5 rounded-full bg-brand-light text-brand-dark text-xs font-bold">Mastercard</span>
                    </div>
                </div>

                <button type="button" id="pay-btn" class="w-full py-5 bg-brand-primary text-white font-black rounded-2xl shadow-xl hover:bg-brand-dark transition-all transform hover:scale-[1.02] active:scale-95 uppercase tracking-widest disabled:opacity-60 disabled:hover:scale-100 disabled:cursor-not-allowed">
                    Confirm &amp; Pay
                </button>

                <p id="pay-error" role="alert" class="hidden mt-4 text-sm text-red-600 leading-relaxed"></p>

                <p class="text-xs text-gray-500 mt-6">Need help? Call <a href="tel:+254701938336" class="font-bold text-brand-primary underline">+254 701 938 336</a></p>
                <p class="text-[10px] text-gray-400 mt-5 font-bold tracking-widest uppercase">&#128274; Secured by Paystack</p>
            </div>

            <!-- SUCCESS CARD -->
            <div id="success-card" class="hidden checkout-card bg-white rounded-[2rem] p-8 md:p-10 text-center">
                <div class="w-16 h-16 bg-brand-accent rounded-full flex items-center justify-center mx-auto mb-5">
                    <svg class="w-8 h-8 text-brand-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>
                </div>
                <h2 class="text-2xl font-black uppercase tracking-tight mb-2">Payment Received</h2>
                <p class="text-gray-600 text-sm leading-relaxed mb-5" id="success-msg"></p>
                <p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-1">Reference</p>
                <p class="font-mono text-sm font-bold text-brand-dark break-all" id="success-ref"></p>
                <p class="text-xs text-gray-400 mt-6">Taking you to your confirmation page...</p>
            </div>
        </div>
    </main>

    <footer class="relative z-10 py-6 text-center text-[10px] text-brand-light/40">
        &copy; 2026 Techtube Video Studio Ltd. &middot; <a href="/privacypolicy.html" class="underline hover:text-brand-accent">Privacy Policy</a>
    </footer>

<script>
(function () {
    // Public key: safe to appear in the page. NEVER put the secret key (sk_...) here.
    var PAYSTACK_KEY = 'pk_live_2032ccaf5ec7576938f03712155f5f3a46d771d3';
    var BACKEND = 'https://techtube-backend-895534116569.us-central1.run.app';

    var params = new URLSearchParams(window.location.search);
    var rawAmount = params.get('amount');
    var amount = Number(rawAmount);
    var currency = (params.get('currency') || 'KES').toUpperCase();
    var email = (params.get('email') || '').trim();
    var name = (params.get('name') || '').trim();
    var desc = (params.get('desc') || '').trim() || 'Video Production Deposit';

    // test hook only; in normal use this is a plain redirect
    function go(url) { if (window.__redirect) window.__redirect(url); else window.location.href = url; }

    var btn = document.getElementById('pay-btn');
    var errEl = document.getElementById('pay-error');
    var descEl = document.getElementById('order-desc');
    var amountEl = document.getElementById('display-amount');
    var btnLabel = btn.textContent.trim();
    var paid = false;

    function showError(msg) { errEl.textContent = msg; errEl.classList.remove('hidden'); }
    function clearError() { errEl.textContent = ''; errEl.classList.add('hidden'); }

    var validAmount = rawAmount !== null && rawAmount !== '' && isFinite(amount) && amount > 0;
    var validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    var validCurrency = currency === 'KES' || currency === 'USD';

    if (!validAmount || !validEmail || !validCurrency) {
        descEl.textContent = 'This payment link looks incomplete.';
        amountEl.textContent = '--';
        btn.disabled = true;
        showError('Please use the payment link from your quote email, or call us on +254 701 938 336 and we will help.');
        return;
    }

    amountEl.textContent = (currency === 'KES' ? 'KES ' : '$') + amount.toLocaleString('en-US');
    descEl.textContent = desc.slice(0, 160);

    function onPaid(reference) {
        paid = true;
        document.getElementById('checkout-card').classList.add('hidden');
        document.getElementById('success-card').classList.remove('hidden');
        document.getElementById('success-msg').textContent =
            'Thank you' + (name ? ', ' + name : '') + '. We have received your deposit and will be in touch shortly to confirm your production slot.';
        document.getElementById('success-ref').textContent = reference;

        // keepalive lets this request finish even while the page navigates away
        var notify = fetch(BACKEND + '/leads/payment-confirmed', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
            body: JSON.stringify({
                source: 'techtube_checkout', name: name || email, email: email,
                topic: 'Deposit Payment Successful',
                message: currency + ' ' + amount + ' (Paystack ref ' + reference + ')'
            })
        }).catch(function () {});

        Promise.race([notify, new Promise(function (r) { setTimeout(r, 3000); })]).then(function () {
            setTimeout(function () {
                go('https://techtubestudio.com/success.html?ref=' + encodeURIComponent(reference));
            }, 1500);
        });
    }

    btn.addEventListener('click', function () {
        if (paid) return;
        clearError();

        if (typeof PaystackPop === 'undefined') {
            showError(window.__paystackFailed
                ? 'We could not load the payment system. Please check your connection or disable ad blockers, then refresh the page.'
                : 'The payment system is still loading. Please wait a moment and try again.');
            return;
        }

        var ref = 'TT-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
        btn.disabled = true;
        btn.textContent = 'Opening secure payment...';

        try {
            var handler = PaystackPop.setup({
                key: PAYSTACK_KEY,
                email: email,
                amount: Math.round(amount * 100), // smallest currency unit, whole number
                currency: currency,
                ref: ref,
                // Plain (non-async) functions: Paystack's inline script rejects async callbacks.
                callback: function (response) { onPaid((response && response.reference) || ref); },
                onClose: function () {
                    if (paid) return;
                    btn.disabled = false;
                    btn.textContent = btnLabel;
                    showError('The payment window was closed before the payment was completed. You can try again whenever you are ready.');
                }
            });
            handler.openIframe();
        } catch (e) {
            btn.disabled = false;
            btn.textContent = btnLabel;
            showError('Something went wrong opening the payment window. Please try again, or call us on +254 701 938 336.');
        }
    });
})();
</script>
</body>
</html>
